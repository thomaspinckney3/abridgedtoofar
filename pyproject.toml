[project]
name = "forage"
version = "0.0.1"
description = "Faithful book abridgment pipeline"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "rapidfuzz>=3.0",
    "json-repair>=0.30",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.scripts]
forage = "forage.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["forage*"]
