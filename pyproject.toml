[project]
name = "forage"
version = "0.0.1"
description = "Faithful book abridgment pipeline"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "anthropic>=0.40",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "rapidfuzz>=3.0",
    "json-repair>=0.30",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pillow>=10.1",
]

[project.optional-dependencies]
# Editorial review web app (forage serve). Not needed for the CLI pipeline.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

# Test suite. httpx is what starlette's TestClient drives the app through.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "setuptools>=68",
    "wheel>=0.41",
]

[project.scripts]
forage = "forage.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["forage*"]

[tool.setuptools.package-data]
"forage.webapp" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: builds and runs the real image; opt in with FORAGE_DOCKER_TESTS=1",
]
