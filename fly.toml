# Fly.io config for the editorial review app.
#
# Rename `app` to whatever `fly launch` created for you. Secrets are never set
# here — use `fly secrets set` so they land in the encrypted store:
#
#   fly secrets set \
#     FORAGE_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')" \
#     FORAGE_REVIEW_TOKEN="$(python -c 'import secrets;print(secrets.token_urlsafe(9))')" \
#     FORAGE_ADMIN_TOKEN="$(python -c 'import secrets;print(secrets.token_urlsafe(12))')"
#
# The app refuses to boot in production without FORAGE_SECRET_KEY and
# FORAGE_REVIEW_TOKEN, so a misconfigured deploy fails the health check
# instead of coming up wide open.

app = "forage-review"
primary_region = "iad"

[build]

[env]
  FORAGE_ENV = "production"
  # Baked into the image by scripts/package_review_artifacts.py.
  FORAGE_WORK_DIR = "/app/artifacts"
  FORAGE_BOOKS_DIR = "/app/books"
  # Per-book mounted artifacts here override baked books without a rebuild.
  FORAGE_ARTIFACT_OVERLAY_DIR = "/data/artifacts"
  FORAGE_BOOKS_OVERLAY_DIR = "/data/books"
  # On the volume, so comments and published overlays survive a deploy.
  FORAGE_REVIEW_DB = "/data/review.db"
  FORAGE_EDITS_DIR = "/data/edits"
  # Fly's proxy sits in front: read the real client IP and scheme from it.
  FORAGE_TRUST_PROXY = "1"
  # Bump to sign every session out at once (e.g. after rotating a token).
  FORAGE_SESSION_EPOCH = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # The comment queue is a SQLite file on one volume: exactly one machine may
  # write it. Keep this at 1 and do not `fly scale count` above 1.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[mounts]
  source = "forage_review_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
