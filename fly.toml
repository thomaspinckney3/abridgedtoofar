# Fly.io config for the editorial review app.
#
# Rename `app` to whatever `fly launch` created for you. Secrets are never set
# here — use `fly secrets set` so they land in the encrypted store:
#
#   fly secrets set FORAGE_BOOTSTRAP_ADMIN_USERNAME=admin \
#     FORAGE_BOOTSTRAP_ADMIN_PASSWORD='a unique password of at least 15 characters'
#
# Bootstrap creates an administrator only when the database has no accounts.
# Remove bootstrap secrets after initialization. Existing accounts survive deploys.

app = "forage-review"
primary_region = "iad"

[build]

[env]
  FORAGE_ENV = "production"
  # Baked into the image by scripts/package_review_artifacts.py.
  FORAGE_WORK_DIR = "/app/artifacts"
  FORAGE_BOOKS_DIR = "/app/books"
  # Per-book mounted artifacts here override baked books without a rebuild.
  FORAGE_ARTIFACT_OVERLAY_DIR = "/data/artifacts"
  FORAGE_BOOKS_OVERLAY_DIR = "/data/books"
  # On the volume, so comments, uploaded revisions and releases survive deploys.
  FORAGE_REVIEW_DB = "/data/review.db"
  FORAGE_EDITS_DIR = "/data/edits"
  FORAGE_HOSTED_ROOT = "/data/hosted"
  # Fly's proxy sits in front: read the real client IP and scheme from it.
  FORAGE_TRUST_PROXY = "1"
  # Origins a write may come from. Without this the cross-origin check falls
  # back to comparing Origin against the request's own Host header — one
  # caller-supplied value against another. Rejecting unknown Host headers
  # outright is separate (FORAGE_STRICT_HOST) and off, because the health
  # check below arrives with the machine's address in Host, not this name.
  FORAGE_ALLOWED_HOSTS = "forage-review.fly.dev"
  # Bump to sign every session out at once (e.g. after an account incident).
  FORAGE_SESSION_EPOCH = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # This is a minimum, not a machine-count cap. Keep the app at one machine:
  # SQLite and uploaded publications are local to its unreplicated volume.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[mounts]
  source = "forage_review_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
